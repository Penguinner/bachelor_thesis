[package]
name = "bachelor_thesis"
version = "0.1.0"
edition = "2024"

[dependencies]
async-compression = { version = "0.4.52", features = ["gzip", "tokio"] }
bollard = "0.21.1"
clap = { version = "4.6.8", features = ["cargo"] }
csv = "1.4.0"
duckdb = { version = "1.20000.2", features = ["bundled"], optional = true }
ftail = "0.3.1"
futures = "0.3.34"
glob = "0.3.4"
itertools = "0.15.0"
log = "0.4.35"
postgres = "0.19.14"
quick-xml = { version = "0.42.0", features = ["escape-html"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.1"

[features]
duckdb = ["dep:duckdb"]

[dev-dependencies]
injectorpp = "0.5.1"
tempfile = "3.27.0"
